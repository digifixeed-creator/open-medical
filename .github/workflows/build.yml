name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          mkdir /tmp/app && cd /tmp/app
          flutter create --org com.openmedical --project-name open_medical .
          rm -rf lib && cp -r "$GITHUB_WORKSPACE/lib" .
          flutter pub add image_picker google_mlkit_text_recognition
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: open-medical-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
